########################################################################
# nginx.conf  –  ResearcherAIAgent
# Roles:
#   1. REVERSE PROXY  – forwards requests to the correct upstream service
#   2. LOAD BALANCER  – distributes traffic across multiple backend replicas
#   3. HTTP ? HTTPS   – redirect all plain-text traffic (production)
########################################################################

# Run as non-root worker process
user  nginx;

# One worker per CPU core for maximum concurrency
worker_processes  auto;

# Error log (written inside the container)
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker
    worker_connections  1024;
    # Accept as many connections as possible at once
    use                 epoll;
    multi_accept        on;
}

http {
    ##############################################################
    # Basics
    ##############################################################
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    ##############################################################
    # Performance
    ##############################################################
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression for text responses
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Hide Nginx version from responses
    server_tokens off;

    ##############################################################
    # Security headers (applied globally)
    ##############################################################
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    ##############################################################
    # Rate limiting zones
    ##############################################################
    # General API rate limit – 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Stricter limit for the /chat endpoint (LLM calls are expensive)
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;

    ##############################################################
    # Load-balancing upstream pools
    ##############################################################

    # -- Backend (FastAPI)  -------------------------------------
    # least_conn  = send new requests to the backend with fewest
    # active connections (ideal for varying-length LLM responses)
    upstream backend_pool {
        least_conn;

        # Scale by adding more backend_X entries here.
        # In Docker Compose the service is "backend"; Docker's
        # internal DNS resolves it to all container IPs.
        server backend:10000  weight=1 max_fails=3 fail_timeout=30s;

        # Uncomment to add more replicas (or set replicas in compose):
        # server backend_2:10000 weight=1 max_fails=3 fail_timeout=30s;
        # server backend_3:10000 weight=1 max_fails=3 fail_timeout=30s;

        keepalive 32;   # reuse HTTP connections to the backend
    }

    # -- Frontend (Next.js) -------------------------------------
    # round_robin (default) – all instances are equivalent
    upstream frontend_pool {
        server frontend:3000  weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    ##############################################################
    # Include per-server virtual-host configs
    ##############################################################
    include /etc/nginx/conf.d/*.conf;
}
