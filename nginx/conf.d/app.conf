########################################################################
# conf.d/app.conf  –  Virtual Host Configuration
#
# Routing map:
#   HTTP  :80                ? 301 redirect to HTTPS (production)
#                            ? direct proxy (development / local)
#   HTTPS :443               ? TLS termination, then proxy
#
#   /api/*   /chat  /chats* ? backend_pool  (FastAPI)
#   /*  (default)           ? frontend_pool (Next.js)
########################################################################

########################################################################
# DEVELOPMENT server – plain HTTP on port 80
# Comment this block out in production and use the HTTPS block below.
########################################################################
server {
    listen       80;
    server_name  localhost;

    # -- Health check endpoint (Nginx itself) -------------------------
    location = /nginx-health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-lb"}';
        add_header Content-Type application/json;
    }

    # -- Backend API routes --------------------------------------------
    # Matches: /chat, /chats, /chats/*, /api/*
    location ~* ^/(chat|chats|api)(/.*)?$ {
        # Apply rate limiting (burst of 10 requests, no delay queue)
        limit_req zone=chat_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;

        # Headers forwarded to FastAPI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive to the upstream
        proxy_set_header   Connection        "";

        # Timeouts – LLM responses can take a while
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;

        # Buffer settings for streaming responses
        proxy_buffering            off;
        proxy_cache_bypass         1;
        proxy_request_buffering    off;
    }

    # -- Frontend (Next.js) – catch-all -------------------------------
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://frontend_pool;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";   # WebSocket support

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     30s;
    }

    # -- Custom error pages --------------------------------------------
    error_page 429 /errors/429.json;
    error_page 502 503 504 /errors/5xx.json;

    location = /errors/429.json {
        internal;
        return 429 '{"error":"Too Many Requests","message":"Slow down – rate limit exceeded","retry_after":1}';
        add_header Content-Type application/json always;
    }

    location = /errors/5xx.json {
        internal;
        return 503 '{"error":"Service Unavailable","message":"Backend is temporarily unavailable, please retry"}';
        add_header Content-Type application/json always;
    }
}

########################################################################
# PRODUCTION server – HTTPS on port 443 + HTTP?HTTPS redirect
# Uncomment this block and comment the HTTP block above when deploying
